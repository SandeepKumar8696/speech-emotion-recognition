<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Speech Emotion Recognition — Demo</title>
<style>
  :root{
    --ink:#1b1b1f;
    --paper:#f6f5f2;
    --line:#d8d5cd;
    --accent:#3a5a78;
    --accent-soft:#dce6ee;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    --sans: "IBM Plex Sans", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:40px 20px; min-height:100vh;
    background:var(--paper); color:var(--ink);
    font-family:var(--sans);
    display:flex; justify-content:center;
  }
  .card{
    width:100%; max-width:560px;
    border:1px solid var(--line);
    background:#fff;
    padding:36px;
  }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--accent); margin-bottom:8px;
  }
  h1{
    font-size:26px; margin:0 0 4px 0; font-weight:700; letter-spacing:-0.01em;
  }
  p.sub{ color:#666; margin:0 0 28px 0; font-size:14px; }

  .dropzone{
    border:1.5px dashed var(--line);
    padding:28px; text-align:center; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    font-family:var(--mono); font-size:13px; color:#666;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent); background:var(--accent-soft);
  }
  input[type=file]{ display:none; }

  #filename{ margin-top:10px; font-size:13px; font-family:var(--mono); color:var(--ink); }

  button{
    margin-top:20px; width:100%; padding:13px;
    background:var(--ink); color:#fff; border:none;
    font-family:var(--mono); font-size:13px; letter-spacing:0.04em;
    text-transform:uppercase; cursor:pointer;
  }
  button:disabled{ background:#bbb; cursor:not-allowed; }
  button:hover:not(:disabled){ background:var(--accent); }

  #result{ margin-top:28px; display:none; }
  .emotion-label{
    font-size:32px; font-weight:700; text-transform:capitalize;
    color:var(--accent); margin-bottom:4px;
  }
  .confidence{ font-family:var(--mono); font-size:13px; color:#666; margin-bottom:18px; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; font-size:12px; font-family:var(--mono); }
  .bar-label{ width:80px; text-transform:capitalize; color:#555; }
  .bar-track{ flex:1; height:8px; background:var(--line); position:relative; }
  .bar-fill{ height:100%; background:var(--accent); }
  .bar-pct{ width:40px; text-align:right; color:#888; }

  #status{ margin-top:14px; font-family:var(--mono); font-size:12px; color:#999; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Audio ML Demo</div>
    <h1>Speech Emotion Recognition</h1>
    <p class="sub">Upload a short .wav clip. The model reads MFCC features and predicts the speaker's emotion.</p>

    <label class="dropzone" id="dropzone" for="audioInput">
      Click to choose a .wav file<br>or drag one in here
    </label>
    <input type="file" id="audioInput" accept=".wav">
    <div id="filename"></div>

    <button id="predictBtn" disabled>Predict Emotion</button>
    <div id="status"></div>

    <div id="result">
      <div class="emotion-label" id="emotionLabel"></div>
      <div class="confidence" id="confidenceText"></div>
      <div id="probBars"></div>
    </div>
  </div>

<script>
  const dropzone = document.getElementById('dropzone');
  const input = document.getElementById('audioInput');
  const filenameEl = document.getElementById('filename');
  const btn = document.getElementById('predictBtn');
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  let selectedFile = null;

  input.addEventListener('change', e => {
    if (e.target.files.length) setFile(e.target.files[0]);
  });

  ['dragover','dragenter'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  ['dragleave','drop'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  dropzone.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
  });

  function setFile(file){
    selectedFile = file;
    filenameEl.textContent = file.name;
    btn.disabled = false;
    result.style.display = 'none';
    status.textContent = '';
  }

  btn.addEventListener('click', async () => {
    if (!selectedFile) return;
    btn.disabled = true;
    status.textContent = 'Running inference...';
    result.style.display = 'none';

    const formData = new FormData();
    formData.append('audio', selectedFile);

    try {
      const res = await fetch('/predict', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      document.getElementById('emotionLabel').textContent = data.emotion;
      document.getElementById('confidenceText').textContent =
        `confidence: ${(data.confidence * 100).toFixed(1)}%`;

      const barsEl = document.getElementById('probBars');
      barsEl.innerHTML = '';
      const sorted = Object.entries(data.all_probabilities).sort((a,b) => b[1]-a[1]);
      for (const [label, prob] of sorted) {
        const pct = (prob * 100).toFixed(1);
        barsEl.innerHTML += `
          <div class="bar-row">
            <div class="bar-label">${label}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="bar-pct">${pct}%</div>
          </div>`;
      }

      result.style.display = 'block';
      status.textContent = '';
    } catch (err) {
      status.textContent = 'Error: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
