<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Emotion Recognition</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">🎙️</div>
      <h1>Speech Emotion Recognition</h1>
      <p class="sub">Upload a short audio clip and the model will predict the speaker's emotion from its acoustic features.</p>
    </div>

    <label class="dropzone" id="dropzone" for="audioInput">
      <div class="dz-icon">📁</div>
      <div><strong>Click to upload</strong> or drag a file here</div>
      <div class="dz-formats">WAV, MP3, OGG, or FLAC</div>
    </label>
    <input type="file" id="audioInput" accept=".wav,.mp3,.ogg,.flac">
    <div class="file-chip" id="fileChip">
      <span class="name" id="fileName"></span>
      <button type="button" class="clear" id="clearFile" aria-label="Remove file">✕</button>
    </div>

    <button class="primary" id="predictBtn" disabled>
      <span class="spinner" id="spinner"></span>
      <span id="btnLabel">Predict Emotion</span>
    </button>
    <div class="hint" id="hint"></div>

    <div id="result">
      <div class="emotion-row">
        <div class="emotion-emoji" id="emotionEmoji"></div>
        <div class="emotion-label" id="emotionLabel"></div>
        <div class="confidence-badge" id="confidenceBadge"></div>
      </div>
      <div id="probBars"></div>
    </div>
  </div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
