<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Emotion Recognition</title>
<style>
  :root{
    --bg-1:#eef2f9;
    --bg-2:#e4ebf5;
    --surface:#ffffff;
    --ink:#161923;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#4f46e5;
    --accent-soft:#eef0fe;
    --accent-dark:#3d33c9;
    --danger:#dc2626;
    --danger-soft:#fef2f2;
    --radius:16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-1:#0f1117; --bg-2:#151824;
      --surface:#1a1d29; --ink:#eef0f7; --muted:#9099ab;
      --line:#2a2e3d; --accent:#7c73ff; --accent-soft:#242545;
      --accent-dark:#9089ff; --danger:#f87171; --danger-soft:#3a1d1f;
    }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; padding:48px 20px;
    background:linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--ink); font-family:var(--font);
    display:flex; justify-content:center; align-items:flex-start;
  }
  .card{
    width:100%; max-width:520px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 20px 40px -20px rgba(20,20,40,0.25);
    padding:36px;
  }
  .header{ text-align:center; margin-bottom:28px; }
  .header .icon{ font-size:36px; line-height:1; margin-bottom:10px; }
  h1{ font-size:22px; margin:0 0 6px; font-weight:700; letter-spacing:-0.01em; }
  p.sub{ color:var(--muted); margin:0; font-size:14px; line-height:1.5; }

  .dropzone{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    border:2px dashed var(--line); border-radius:12px;
    padding:28px 16px; text-align:center; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    color:var(--muted); font-size:14px;
  }
  .dropzone .dz-icon{ font-size:22px; opacity:.8; }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent); background:var(--accent-soft);
  }
  input[type=file]{ display:none; }

  .file-chip{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    margin-top:12px; padding:10px 14px;
    background:var(--accent-soft); border-radius:10px;
    font-size:13px; color:var(--ink);
  }
  .file-chip .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-chip .clear{
    cursor:pointer; color:var(--muted); font-size:16px; line-height:1;
    border:none; background:none; padding:0 2px;
  }
  .file-chip .clear:hover{ color:var(--danger); }

  button.primary{
    margin-top:20px; width:100%; padding:14px;
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    font-size:14px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:background .15s ease, transform .1s ease;
  }
  button.primary:hover:not(:disabled){ background:var(--accent-dark); }
  button.primary:active:not(:disabled){ transform:scale(0.99); }
  button.primary:disabled{ background:var(--line); color:var(--muted); cursor:not-allowed; }

  .spinner{
    width:15px; height:15px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    animation:spin .7s linear infinite; display:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .hint{ margin-top:10px; font-size:12px; color:var(--muted); text-align:center; min-height:16px; }
  .hint.error{ color:var(--danger); }

  #result{ display:none; margin-top:28px; padding-top:24px; border-top:1px solid var(--line); }
  .emotion-row{ display:flex; align-items:center; gap:14px; margin-bottom:20px; }
  .emotion-emoji{ font-size:40px; line-height:1; }
  .emotion-label{ font-size:24px; font-weight:700; text-transform:capitalize; }
  .confidence-badge{
    margin-left:auto; font-size:13px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); padding:5px 10px; border-radius:999px;
  }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12.5px; }
  .bar-label{ width:72px; text-transform:capitalize; color:var(--muted); flex-shrink:0; }
  .bar-track{ flex:1; height:8px; background:var(--line); border-radius:999px; overflow:hidden; }
  .bar-fill{
    height:100%; background:var(--accent); border-radius:999px; width:0;
    transition:width .5s ease;
  }
  .bar-pct{ width:38px; text-align:right; color:var(--muted); flex-shrink:0; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">🎙️</div>
      <h1>Speech Emotion Recognition</h1>
      <p class="sub">Upload a short .wav clip and the model will predict the speaker's emotion from its acoustic features.</p>
    </div>

    <label class="dropzone" id="dropzone" for="audioInput">
      <div class="dz-icon">📁</div>
      <div><strong>Click to upload</strong> or drag a .wav file here</div>
    </label>
    <input type="file" id="audioInput" accept=".wav">
    <div class="file-chip" id="fileChip">
      <span class="name" id="fileName"></span>
      <button type="button" class="clear" id="clearFile" aria-label="Remove file">✕</button>
    </div>

    <button class="primary" id="predictBtn" disabled>
      <span class="spinner" id="spinner"></span>
      <span id="btnLabel">Predict Emotion</span>
    </button>
    <div class="hint" id="hint"></div>

    <div id="result">
      <div class="emotion-row">
        <div class="emotion-emoji" id="emotionEmoji"></div>
        <div class="emotion-label" id="emotionLabel"></div>
        <div class="confidence-badge" id="confidenceBadge"></div>
      </div>
      <div id="probBars"></div>
    </div>
  </div>

<script>
  const EMOJI = {
    angry:'😠', happy:'😄', sad:'😢', neutral:'😐',
    fear:'😨', disgust:'🤢', calm:'😌', surprise:'😲'
  };

  const dropzone = document.getElementById('dropzone');
  const input = document.getElementById('audioInput');
  const fileChip = document.getElementById('fileChip');
  const fileNameEl = document.getElementById('fileName');
  const clearFileBtn = document.getElementById('clearFile');
  const btn = document.getElementById('predictBtn');
  const btnLabel = document.getElementById('btnLabel');
  const spinner = document.getElementById('spinner');
  const hint = document.getElementById('hint');
  const result = document.getElementById('result');

  let selectedFile = null;

  input.addEventListener('change', e => {
    if (e.target.files.length) setFile(e.target.files[0]);
  });

  ['dragover', 'dragenter'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  dropzone.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
  });

  clearFileBtn.addEventListener('click', () => {
    selectedFile = null;
    input.value = '';
    fileChip.style.display = 'none';
    dropzone.style.display = 'flex';
    btn.disabled = true;
    result.style.display = 'none';
    hint.textContent = '';
  });

  function setFile(file){
    selectedFile = file;
    fileNameEl.textContent = file.name;
    fileChip.style.display = 'flex';
    dropzone.style.display = 'none';
    btn.disabled = false;
    result.style.display = 'none';
    hint.className = 'hint';
    hint.textContent = '';
  }

  function setLoading(isLoading){
    btn.disabled = isLoading;
    spinner.style.display = isLoading ? 'inline-block' : 'none';
    btnLabel.textContent = isLoading ? 'Analyzing…' : 'Predict Emotion';
  }

  btn.addEventListener('click', async () => {
    if (!selectedFile) return;
    setLoading(true);
    hint.className = 'hint';
    hint.textContent = 'First prediction can take up to 30s while the model warms up.';
    result.style.display = 'none';

    const formData = new FormData();
    formData.append('audio', selectedFile);

    try {
      const res = await fetch('/predict', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      document.getElementById('emotionEmoji').textContent = EMOJI[data.emotion] || '🎧';
      document.getElementById('emotionLabel').textContent = data.emotion;
      document.getElementById('confidenceBadge').textContent =
        `${(data.confidence * 100).toFixed(1)}% confident`;

      const barsEl = document.getElementById('probBars');
      barsEl.innerHTML = '';
      const sorted = Object.entries(data.all_probabilities).sort((a, b) => b[1] - a[1]);
      for (const [label, prob] of sorted) {
        const pct = (prob * 100).toFixed(1);
        const row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML = `
          <div class="bar-label">${label}</div>
          <div class="bar-track"><div class="bar-fill"></div></div>
          <div class="bar-pct">${pct}%</div>`;
        barsEl.appendChild(row);
        requestAnimationFrame(() => {
          row.querySelector('.bar-fill').style.width = pct + '%';
        });
      }

      result.style.display = 'block';
      hint.textContent = '';
    } catch (err) {
      hint.className = 'hint error';
      hint.textContent = 'Error: ' + err.message;
    } finally {
      setLoading(false);
    }
  });
</script>
</body>
</html>
